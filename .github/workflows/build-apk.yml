name: Build APK

on:
  push:
    branches:
      - main
      - codespace-crispy-xylophone-xrrr446qvxp7hvrqr
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: cd skillverse_app && flutter pub get
      - run: cd skillverse_app && flutter build apk --debug
      - name: Print SHA-1
        continue-on-error: true
        run: |
          ls -la ~/.android/ || true
          find / -name "debug.keystore" 2>/dev/null || true
          keytool -list -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android || true
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: skillverse_app/build/app/outputs/flutter-apk/app-debug.apk
