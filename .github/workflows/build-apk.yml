name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: cd skillverse_app && flutter pub get
      - run: cd skillverse_app && flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: skillverse_app/build/app/outputs/flutter-apk/app-debug.apk
