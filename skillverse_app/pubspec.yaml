name: skillverse_app
description: SkillVerse — Learn. Compete. Earn. Teach.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  google_sign_in: ^6.2.1

  # State management
  provider: ^6.1.2

  # Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

  # Fonts / UI
  google_fonts: ^6.2.1

  # Create Post feature
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.4
  video_player: ^2.9.1
  uuid: ^4.4.0
  video_compress: ^3.1.3
  http: ^1.2.2
  share_plus: ^11.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
flutter_launcher_icons: ^0.13.1
